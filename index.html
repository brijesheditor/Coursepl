<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uttar Pradesh B.Sc Nursing 1.0 Course Player</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; overflow-x: hidden; }
    .app-container { display: flex; min-height: 100vh; flex-direction: row; }

    .sidebar { width: 360px; background: #1e293b; padding: 16px; border-right: 1px solid #334155; display: flex; flex-direction: column; gap: 12px; }
    .sidebar h2 { font-size: 1.1rem; color: #38bdf8; text-align: center; }

    .tab-buttons { display: flex; gap: 8px; }
    .tab-btn { flex: 1; padding: 8px; background: #334155; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    .tab-btn.active { background: #0284c7; font-weight: bold; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .input-card { display: flex; flex-direction: column; gap: 8px; background: #0f172a; padding: 12px; border-radius: 8px; }
    .input-card label { font-size: 0.8rem; color: #94a3b8; }
    .input-card input { padding: 8px; background: #1e293b; border: 1px solid #475569; color: #fff; border-radius: 4px; font-size: 0.85rem; }
    .input-card button { padding: 10px; background: #10b981; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 6px; }

    .pdf-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .pdf-list a { color: #38bdf8; text-decoration: none; font-size: 0.9rem; background: #0f172a; padding: 8px; border-radius: 4px; display: block; }
    .pdf-list a:hover { background: #334155; }

    .main-player { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .player-container { width: 100%; max-width: 900px; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; }
    video { width: 100%; height: 100%; }
    #videoTitle { margin-top: 12px; font-weight: 500; color: #cbd5e1; }

    @media (max-width: 768px) {
      .app-container { flex-direction: column-reverse; }
      .sidebar { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="sidebar">
      <h2>B.Sc Nursing Batch</h2>
      <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchTab(event, 'drm')">Live Player</button>
        <button class="tab-btn" onclick="switchTab(event, 'pdfs')">PDF Notes</button>
      </div>

      <div id="drm" class="tab-content active">
        <div class="input-card">
          <label>MPD Stream URL:</label>
          <input type="text" id="mpdUrl" placeholder="MPD Link yahan dalein">
          
          <label>DRM Key (KID:KEY):</label>
          <input type="text" id="keyPair" placeholder="6573a98cdf4d65bbe27d382338138c4f:7fc0cf29fc7ca6feb153c79c07222eae">
          
          <button onclick="playDRMStream()">Stream Play Karein</button>
        </div>
      </div>

      <div id="pdfs" class="tab-content">
        <ul class="pdf-list">
          <li><a href="https://cdn-wl-assets.classplus.co/production/352407/8fa0f300-ce39-4285-a3e7-ab391f06ac72.pdf" target="_blank">Chemistry Important Topics PDF</a></li>
          <li><a href="https://cdn-wl-assets.classplus.co/production/352407/587ba46a-e961-458e-81af-4cefec5c60a8.pdf" target="_blank">Elements 1–30 Atomic Mass PDF</a></li>
          <li><a href="https://cdn-wl-assets.classplus.co/production/352407/c959310d-8fa7-46a6-b244-821b0516ef1c.pdf" target="_blank">Pollution & Environment PDF</a></li>
          <li><a href="https://cdn-wl-assets.classplus.co/production/352407/b4714db9-82fe-4ed0-a7e6-7c3259ab0369.pdf" target="_blank">Important Chemical Formula PDF</a></li>
        </ul>
      </div>
    </div>

    <div class="main-player">
      <div class="player-container">
        <video id="video" controls autoplay></video>
      </div>
      <h3 id="videoTitle">Select or Paste Stream to Play</h3>
    </div>
  </div>

  <script>
    let player;

    document.addEventListener('DOMContentLoaded', () => {
      shaka.polyfill.installAll();
      if (shaka.Player.isBrowserSupported()) {
        const video = document.getElementById('video');
        player = new shaka.Player(video);
        player.addEventListener('error', (e) => console.error('Shaka Player Error:', e.detail));
      } else {
        alert('Aapka browser video player support nahi karta.');
      }
    });

    async function playDRMStream() {
      const mpdUrl = document.getElementById('mpdUrl').value.trim();
      const keyPair = document.getElementById('keyPair').value.trim();

      if (!mpdUrl) {
        alert('Kripya MPD URL enter karein.');
        return;
      }

      let clearKeysObj = {};
      if (keyPair && keyPair.includes(':')) {
        const [kid, key] = keyPair.split(':');
        clearKeysObj[kid.trim()] = key.trim();
      }

      player.configure({
        drm: { clearKeys: clearKeysObj }
      });

      try {
        await player.load(mpdUrl);
        document.getElementById('videoTitle').innerText = 'Playing Stream';
      } catch (err) {
        console.error('Error loading stream:', err);
        alert('Stream load nahi ho saki. Link ya Key galat ho sakti hai.');
      }
    }

    function switchTab(evt, tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      evt.currentTarget.classList.add('active');
    }
  </script>
</body>
</html>
