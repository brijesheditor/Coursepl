<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classplus Course Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; min-height: 100vh; }

    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { color: #38bdf8; font-size: 1.8rem; margin-bottom: 8px; }
    .header p { color: #94a3b8; font-size: 0.9rem; }

    .search-card { max-width: 600px; margin: 0 auto 24px auto; background: #1e293b; padding: 16px; border-radius: 12px; border: 1px solid #334155; }
    .search-group { display: flex; gap: 10px; margin-top: 10px; }
    input[type="text"] { flex: 1; padding: 12px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 8px; font-size: 0.95rem; outline: none; }
    input[type="text"]:focus { border-color: #0284c7; }
    button { padding: 12px 20px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }

    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; max-width: 1200px; margin: 0 auto; }
    .card { background: #1e293b; border: 1px solid #334155; padding: 16px; border-radius: 10px; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
    .card h3 { font-size: 1.05rem; color: #f1f5f9; }
    .org-badge { display: inline-block; background: #0f172a; color: #38bdf8; padding: 4px 8px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; width: fit-content; border: 1px solid #334155; }
    .card-btn { width: 100%; background: #10b981; padding: 10px; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; display: block; }
    .card-btn:hover { background: #059669; }

    @media (max-width: 600px) {
      .search-group { flex-direction: column; }
      body { padding: 12px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Classplus Institute Web Portal</h1>
    <p>Apna Org Code chunen ya search karke portal access karein</p>
  </div>

  <div class="search-card">
    <label style="font-size: 0.85rem; color: #94a3b8;">Direct Custom Org Code Access:</label>
    <div class="search-group">
      <input type="text" id="customOrg" placeholder="Enter Org Code (e.g. EBEPI)">
      <button onclick="openCustomOrg()">Open Portal</button>
    </div>
    <div style="margin-top: 14px;">
      <input type="text" id="searchInput" onkeyup="filterCards()" placeholder="Search Institute Name or Org Code...">
    </div>
  </div>

  <div class="grid-container" id="instituteGrid"></div>

  <script>
    const institutes = [
      { name: "Wisdom Nursing Classes", code: "EBEPI" },
      { name: "GDC CLASSES", code: "GDCCLASS" },
      { name: "Concept RNA Nursing Coaching", code: "NBHOM" },
      { name: "Z to F Medical & Nursing Academy", code: "EOCJVH" },
      { name: "Vijay Education", code: "CXAZC" },
      { name: "TIWARI CLASSES", code: "UEREG" },
      { name: "GURU NURSING ACADEMY", code: "AOGBW" },
      { name: "DNA Nursing Academy", code: "TYTQG" },
      { name: "OM Nursing Academy", code: "BGCJO" },
      { name: "UDAAN NURSING ACADEMY", code: "ZCVXQ" },
      { name: "NURSING 2 NORCET", code: "LADCHR" },
      { name: "ONLINE SCHOOL INDIA", code: "MZS" },
      { name: "Reasoning Rishi Sir", code: "QXRTB" },
      { name: "Shivalya Classes", code: "JFGPO" },
      { name: "PRATIBHA CLASSES", code: "JNIGJ" },
      { name: "India Studies", code: "MQPFF" }
    ];

    function loadInstitutes() {
      const grid = document.getElementById('instituteGrid');
      grid.innerHTML = '';
      institutes.forEach(inst => {
        grid.innerHTML += `
          <div class="card">
            <div>
              <h3>${inst.name}</h3>
              <div class="org-badge" style="margin-top: 8px;">ORG: ${inst.code}</div>
            </div>
            <button class="card-btn" onclick="launchPortal('${inst.code}')">Access Portal</button>
          </div>
        `;
      });
    }

    function filterCards() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.card');
      institutes.forEach((inst, index) => {
        const isMatch = inst.name.toLowerCase().includes(query) || inst.code.toLowerCase().includes(query);
        cards[index].style.display = isMatch ? 'flex' : 'none';
      });
    }

    function launchPortal(code) {
      window.open(`https://web.classplusapp.com/login?orgCode=${code}`, '_blank');
    }

    function openCustomOrg() {
      const code = document.getElementById('customOrg').value.trim();
      if (code) {
        launchPortal(code);
      } else {
        alert('Kripya valid Org Code enter karein.');
      }
    }

    loadInstitutes();
  </script>
</body>
</html>
